<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Photo Picker</h1>
      <p class="subtitle">Selamat datang di aplikasi Photo Picker. Pilih peran yang sesuai untuk mulai.</p>
    </div>
  </header>

  <main class="layout" style="grid-template-columns: 1fr;">
    <section class="panel">
      <div class="panel-header">
        <h2>Pilih Peran</h2>
      </div>
      <p class="subtitle" style="margin-bottom:16px;">
        Vendor/FG untuk menyiapkan foto dan mengunci pilihan. Client untuk memilih foto dan mengirim hasilnya.
      </p>
      <div class="actions">
        <a class="primary" href="vendor.html" style="text-decoration:none; padding:12px 18px; border-radius:999px;">Vendor / FG</a>
        <a class="ghost" href="client.html" style="text-decoration:none; padding:12px 18px; border-radius:999px; border:1px solid var(--border);">Client</a>
      </div>
    </section>
    <section class="panel">
      <div class="panel-header">
        <h2>Atur PIN Vendor</h2>
      </div>
      <div class="field">
        <label for="landingPinInput">PIN Baru</label>
        <input id="landingPinInput" type="password" placeholder="Contoh: 1234" />
      </div>
      <div class="actions">
        <button id="landingSetPin" class="primary">Simpan PIN</button>
        <button id="landingClearPin" class="ghost">Hapus PIN</button>
      </div>
      <div id="landingPinStatus" class="muted"></div>
    </section>
  </main>
</body>
<script>
  const pinKey = "photoPicker.vendorPin";
  const pinInput = document.getElementById("landingPinInput");
  const setBtn = document.getElementById("landingSetPin");
  const clearBtn = document.getElementById("landingClearPin");
  const statusEl = document.getElementById("landingPinStatus");

  function updateStatus() {
    const current = localStorage.getItem(pinKey);
    statusEl.textContent = current ? "PIN sudah tersimpan." : "Belum ada PIN.";
  }

  setBtn.addEventListener("click", () => {
    const value = pinInput.value.trim();
    if (!value) {
      statusEl.textContent = "Masukkan PIN terlebih dahulu.";
      return;
    }
    localStorage.setItem(pinKey, value);
    pinInput.value = "";
    updateStatus();
  });

  clearBtn.addEventListener("click", () => {
    localStorage.removeItem(pinKey);
    updateStatus();
  });

  updateStatus();
</script>
</html>
