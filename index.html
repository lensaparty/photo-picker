<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Photo Picker</h1>
      <p class="subtitle">Masuk atau buat akun untuk melanjutkan.</p>
    </div>
  </header>

  <main class="layout" style="grid-template-columns: 1fr;">
    <section class="panel auth-panel">
      <div class="panel-header">
        <h2>Welcome Back</h2>
      </div>
      <div class="auth-tabs">
        <button id="tabLogin" class="ghost active">Login</button>
        <button id="tabRegister" class="ghost">Create Account</button>
      </div>

      <div id="authError" class="muted" style="margin-bottom:8px;"></div>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="you@email.com" required />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="primary">Log In</button>
      </form>

      <form id="registerForm" class="auth-form" style="display:none;">
        <div class="field">
          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" placeholder="you@email.com" required />
        </div>
        <div class="field">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" placeholder="Min. 6 karakter" required />
        </div>
        <button type="submit" class="primary">Create Account</button>
      </form>

      <div class="auth-divider">atau</div>
      <button id="googleLogin" class="ghost">Continue with Google</button>
    </section>
  </main>
</body>
<script type="module">
  import { initAuthPage } from "./auth.js";
  initAuthPage();
</script>
</html>
