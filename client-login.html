<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Login - Photo Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-modern">
    <section class="auth-modern-card">
      <div class="auth-modern-form">
        <div class="auth-brand">Lensaparty</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login client untuk pilih foto.</p>

        <div class="auth-tabs">
          <button id="tabLogin" class="ghost active">Log In</button>
        </div>
        <div id="authError" class="muted" style="margin-bottom:8px;"></div>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label for="loginEmail">Kode Client</label>
            <input id="loginEmail" type="text" placeholder="misal: fidaferdi2402" required />
          </div>
          <div class="auth-inline">
            <span class="muted">Client portal</span>
            <span class="muted">Hubungi vendor jika lupa kode</span>
          </div>
          <button type="submit" class="primary full">Log In</button>
        </form>

        <a href="admin-login.html" class="link-btn" style="align-self:flex-start;">Masuk sebagai Admin</a>
      </div>

      <div class="auth-modern-visual">
        <div class="auth-visual-content">
          <p>Visual-first picker untuk kurasi foto wedding lebih cepat dan rapi.</p>
        </div>
      </div>
    </section>
  </main>
  <script type="module">
    import { initClientAuthPage } from "./auth.js";
    initClientAuthPage();
  </script>
</body>
</html>
