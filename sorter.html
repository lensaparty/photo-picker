<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Picker - Local Sorter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Local Sorter</h1>
      <p class="subtitle">Copy file terpilih (JPG + RAW) ke folder output tanpa terminal.</p>
    </div>
  </header>

  <main class="layout" style="grid-template-columns: 1fr;">
    <section class="panel">
      <div class="panel-header">
        <h2>Langkah</h2>
      </div>
      <ol>
        <li>Pilih folder sumber foto.</li>
        <li>Pilih folder output (mis. “terpilih”).</li>
        <li>Paste hasil Export Terpilih dari aplikasi.</li>
        <li>Klik “Mulai Copy”.</li>
      </ol>

      <div class="actions" style="margin-top:12px;">
        <button id="pickSource" class="primary">Pilih Folder Sumber</button>
        <button id="pickOutput" class="ghost">Pilih Folder Output</button>
      </div>

      <div class="field" style="margin-top:16px;">
        <label for="exportText">Paste hasil Export Terpilih</label>
        <textarea id="exportText" rows="8" placeholder="Paste teks export di sini..."></textarea>
      </div>

      <div class="actions">
        <button id="startCopy" class="primary">Mulai Copy</button>
        <span id="statusText" class="muted"></span>
      </div>
    </section>
  </main>

  <script src="sorter.js"></script>
</body>
</html>
