<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Photo Picker By Lensaparty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Pilih Foto dari Folder Drive</h2>

  <input
    id="folderInput"
    type="text"
    placeholder="Paste link folder Google Drive di sini"
    style="width:100%; padding:10px; margin-bottom:12px;"
  />

  <div class="actions">
  <button id="loadBtn" class="primary">Tampilkan Foto</button>
  <button id="finishBtn">Selesai</button>
  <button id="resetBtn">Reset</button>
</div>

</button>

  <div id="grid" style="margin-top:20px;"></div>

  <div id="result" style="margin-top:20px;"></div>

  <script src="script.js"></script>
  
  
</body>
</html>
