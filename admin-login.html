<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - Photo Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-modern">
    <section class="auth-modern-card">
      <div class="auth-modern-form">
        <div class="auth-brand">Lensaparty</div>
        <h2>Admin Login</h2>
        <p class="subtitle">Untuk Admin Pusat & Admin Cabang.</p>

        <button id="googleLogin" class="ghost full">Log In with Google</button>
        <div class="auth-divider">atau login dengan email</div>

        <div class="auth-tabs">
          <button id="tabLogin" class="ghost active">Log In</button>
          <button id="tabRegister" class="ghost">Create Account</button>
        </div>
        <div id="authError" class="muted" style="margin-bottom:8px;"></div>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label for="loginEmail">Email address</label>
            <input id="loginEmail" type="email" placeholder="admin@email.com" required />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" placeholder="Min. 8 Characters" required />
          </div>
          <div class="auth-inline">
            <span class="muted">Admin only</span>
            <button id="forgotPassword" type="button" class="link-btn">Forgot password?</button>
          </div>
          <button type="submit" class="primary full">Log In</button>
        </form>

        <form id="registerForm" class="auth-form" style="display:none;"></form>
        <a href="client-login.html" class="link-btn" style="align-self:flex-start;">Masuk sebagai Client</a>
      </div>

      <div class="auth-modern-visual">
        <div class="auth-visual-content">
          <p>Vendor workspace untuk kurasi, locking, dan distribusi hasil pilih client.</p>
        </div>
      </div>
    </section>
  </main>
  <script type="module">
    import { initAdminAuthPage } from "./auth.js";
    initAdminAuthPage();
  </script>
</body>
</html>
